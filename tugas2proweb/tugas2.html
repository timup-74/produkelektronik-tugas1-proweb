<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FORMULIR PENDATAAN DIRI</title>
    <link rel="stylesheet" href="html.css">
  </head>
  <body>
    <form>
      <fieldset>
        <legend>Akun</legend>

        <table>
          <tr>
            <td><label for="username">Username</label></td>
            <td>:</td>
            <td>
              <input type="text" id="username" name="username" />
            </td>
          </tr>

          <tr>
            <td><label for="password">Password</label></td>
            <td>:</td>
            <td>
              <input type="password" id="password" name="password" />
            </td>
          </tr>

          <tr>
            <td><label for="konfirmasi">Konfirmasi Password</label></td>
            <td>:</td>
            <td>
              <input type="password" id="konfirmasi" name="konfirmasi" />
            </td>
          </tr>
        </table>
      </fieldset>

      <fieldset>
        <legend>Data</legend>

        <table>
          <tr>
            <td><label for="nama">Nama</label></td>
            <td>:</td>
            <td>
              <input type="text" id="nama" name="nama" />
            </td>
          </tr>

          <tr>
            <td>Jurusan</td>
            <td>:</td>
            <td>
              <select id="jurusan" name="jurusan">
                <option value="">Pilih Jurusan</option>
                <option value="ti">Teknologi Informasi</option>
                <option value="si">Sistem Informasi</option>
                <option value="ilkom">Ilmu Komputer</option>
              </select>
            </td>
          </tr>

          <tr>
            <td>Alamat</td>
            <td>:</td>
            <td><textarea id="alamat" name="alamat"></textarea></td>
          </tr>

          <tr>
            <td>Jenis Kelamin</td>
            <td>:</td>
            <td>
              <input type="radio" id="pria" name="gender" value="Pria" />
              <label for="pria">Pria</label>
              <br />

              <input
                type="radio"
                id="perempuan"
                name="gender"
                value="Perempuan"
              />
              <label for="perempuan">Perempuan</label>
            </td>
          </tr>

          <tr>
            <td>Informasi Yang Disukai</td>
            <td>:</td>
            <td>
              <input
                type="checkbox"
                id="olahraga"
                name="info"
                value="Olahraga"
              />
              <label for="olahraga">Olahraga</label>
              <br />

              <input
                type="checkbox"
                id="travelling"
                name="info"
                value="Travelling"
              />
              <label for="travelling">Travelling</label>
              <br />

              <input
                type="checkbox"
                id="kesehatan"
                name="info"
                value="Kesehatan"
              />
              <label for="kesehatan">Kesehatan</label>
            </td>
          </tr>
        </table>
      </fieldset>

      <br />

      <input type="submit" value="Daftar" />
      <input type="reset" value="Reset" />
    </form>
  </body>
</html>
